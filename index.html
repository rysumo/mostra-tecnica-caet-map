<!DOCTYPE html>

<head>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

      theme: {
        extend: {
          colors: {
            caet: {
              DEFAULT: '#0e3d26',
              dark: '#082517',
              light: '#14532d',

              surface: '#f8fafc',

  <style>
    /* Fullscreen Viewport Setup */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0e3d26;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    /* Custom Leaflet Controls */
    .leaflet-bar {
      border: none !important;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3) !important;
      border-radius: 14px !important;
      overflow: hidden;
    }
    .leaflet-bar a {
      background-color: #ffffff !important;
      color: #0f172a !important;
      width: 44px !important;
      height: 44px !important;
      line-height: 44px !important;
      font-size: 20px !important;
      font-weight: 600 !important;
      border-bottom: 1px solid #f1f5f9 !important;
      transition: background-color 0.15s ease;
    }
    .leaflet-bar a:hover {
      background-color: #f8fafc !important;
    }

    /* Attribution styling */
    .leaflet-control-attribution {
      background: rgba(15, 23, 42, 0.75) !important;
      backdrop-filter: blur(8px) !important;
      color: #e2e8f0 !important;
      font-size: 10px !important;
      padding: 3px 10px !important;
      border-radius: 8px 0 0 0 !important;
      border-top: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-left: 1px solid rgba(255, 255, 255, 0.1) !important;
    }
    .leaflet-control-attribution a {
      color: #38bdf8 !important;
      text-decoration: none;
    }

    /* Custom Popup Box */
    .leaflet-popup-content-wrapper {
      padding: 0 !important;
      border-radius: 20px !important;
      overflow: hidden;
      box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.4), 0 10px 15px -5px rgba(0, 0, 0, 0.2) !important;
      border: 1px solid rgba(255, 255, 255, 0.9) !important;
      background: #ffffff !important;
    }
    .leaflet-popup-content {
      margin: 0 !important;
      line-height: 1.4 !important;
    }
    .leaflet-popup-tip-container {
      margin-top: -1px;
    }
    .leaflet-popup-tip {
      background: #ffffff !important;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2) !important;
    }
    .leaflet-container a.leaflet-popup-close-button {
      display: none !important;
    }

    /* Hide scrollbars */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Pulsating GPS Radar */
    .gps-pulse-outer {
      width: 32px;
      height: 32px;
      background: rgba(14, 165, 233, 0.25);
      border-radius: 50%;
      position: absolute;
      top: -8px;
      left: -8px;
      animation: pulse-radar 2.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    .gps-pulse-inner {
      width: 16px;
      height: 16px;
      background: #0284c7;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
    }
    @keyframes pulse-radar {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* Marker Active / Bounce Animation */
    .custom-map-pin {
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.2s ease;
      cursor: pointer;
    }
    .custom-map-pin:hover {
      transform: translateY(-4px) scale(1.08);
      filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.45)) !important;
    }
    .pin-selected {
      transform: translateY(-6px) scale(1.15) !important;
      filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.55)) !important;
      z-index: 9999 !important;
    }

    /* Safe Area insets for modern notched phones */
    .safe-top {
      padding-top: max(12px, env(safe-area-inset-top));
    }
    .safe-bottom {
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }

</head>
<body class="relative w-screen h-screen">

  <!-- TOP OVERLAY: Header, Search & Filters -->

    <!-- Top Bar: Title & Primary Actions -->
    <div class="px-4 pt-1 pb-2 flex items-center justify-between">
      <div>
        <div class="flex items-center gap-1.5">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-[10px] font-extrabold tracking-widest text-emerald-300 uppercase">MOSTRA TÉCNICA CAET</span>
        </div>
        <h1 class="text-2xl font-black text-white tracking-tight leading-none mt-0.5">Mapa do evento</h1>

      <!-- Action Buttons Right (Min 44px for ergonomics) -->
      <div class="flex items-center gap-2">

        <button id="btn-toggle-layer" title="Alternar Imagem de Satélite / Ruas" class="w-11 h-11 rounded-2xl bg-white/10 hover:bg-white/20 active:scale-90 border border-white/15 flex items-center justify-center text-white transition-all shadow-sm">
          <svg class="w-5 h-5 text-emerald-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
          </svg>
        </button>

        <!-- Geolocate / GPS -->
        <button id="btn-locate-me" title="Minha Localização no Campus (GPS)" class="w-11 h-11 rounded-2xl bg-white/10 hover:bg-white/20 active:scale-90 border border-white/15 flex items-center justify-center text-white transition-all shadow-sm relative">
          <svg class="w-5 h-5 text-emerald-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="7" stroke-width="2"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v3m0 14v3M2 12h3m14 0h3"/>
            <circle cx="12" cy="12" r="2" fill="currentColor"/>
          </svg>
          <span id="gps-active-badge" class="hidden absolute top-1 right-1 w-2.5 h-2.5 rounded-full bg-sky-400 border-2 border-[#0e3d26]"></span>
        </button>

        <!-- Drawer List View Toggle -->
        <button id="btn-open-list" title="Lista de Setores" class="w-11 h-11 rounded-2xl bg-white/10 hover:bg-white/20 active:scale-90 border border-white/15 flex items-center justify-center text-white transition-all shadow-sm">
          <svg class="w-5 h-5 text-emerald-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />

        </button>
      </div>
    </div>

    <!-- Search Input Floating Box -->

          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M20 20l-4-4"/>
        </svg>
        <input 
          id="search-input"

        />

    </div>

  </aside>

    // --- 4. MAP BOOTSTRAP ---
    function syncCounts() {
      const counts = MAP_DATA.locations.reduce((acc, loc) => {
        acc[loc.category] = (acc[loc.category] || 0) + 1;
        return acc;
      }, {});
      const total = MAP_DATA.locations.length;

      document.querySelectorAll('.cat-pill').forEach(pill => {
        const cat = pill.dataset.cat;
        const badge = pill.querySelector('.pill-count');
        if (badge) {
          badge.textContent = cat === 'all' ? total : (counts[cat] || 0);
        }
      });

      const catalogLabel = document.getElementById('btn-quick-catalog-label');
      if (catalogLabel) {
        catalogLabel.textContent = `Setores da Mostra (${total})`;
      }
    }

    function initMap() {
      syncCounts();

      map = L.map('map', {
        center: MAP_DATA.center,
        zoom: MAP_DATA.defaultZoom,
        zoomControl: false,
        layers: [googleHybrid]
      });

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      polygonLayer.addTo(map);
      markersLayer.addTo(map);

      drawPolygons();
      renderMarkers();
      buildDrawerList();
    }

    // --- 5. DRAW POLYGON BOUNDARIES ---
    function drawPolygons() {
      polygonLayer.clearLayers();
      MAP_DATA.polygons.forEach(p => {
        const poly = L.polygon(p.coordinates, {
          color: p.color,
          weight: 2.5,
          opacity: 0.95,
          dashArray: '6, 6',
          fillColor: p.color,
          fillOpacity: 0.2
        });

        poly.bindTooltip(p.name, {
          sticky: true,
          className: 'bg-purple-900/95 text-white font-bold text-xs rounded-lg px-2.5 py-1.5 shadow-lg'
        });

        polygonLayer.addLayer(poly);
      });
    }

    // --- 6. HAVERSINE DISTANCE CALCULATOR ---
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // Earth radius in meters
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c);
    }

    function formatDistance(meters) {
      if (!meters && meters !== 0) return '';
      if (meters < 1000) return `${meters}m de você`;
      return `${(meters / 1000).toFixed(1)}km de você`;
    }

            </div>
          </div>
        `;

        marker.bindPopup(popupContent, {
          closeButton: false,
          offset: [0, -10]
        });

        markersLayer.addLayer(marker);
        markersMap.set(loc.id, marker);
      });
    }

    window.copyGps = function(text) {
      navigator.clipboard.writeText(text);
      showToast("Coordenadas GPS copiadas!");
    };

    window.sharePlace = function(name, lat, lng) {
      const url = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
      if (navigator.share) {
        navigator.share({
          title: `Mostra Técnica CAET — ${name}`,
          text: `Confira o setor "${name}" no mapa da Mostra Técnica do CAET:`,
          url: url
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(`${name}: ${url}`);
        showToast("Link do local copiado!");
      }
    };

    // --- 8. ZOOM AND FOCUS ACTIONS ---
    window.zoomToLocation = function(lat, lng) {
      map.flyTo([lat, lng], 19, {
        animate: true,
        duration: 1.2
      });
    };

    function focusOnPlace(locId) {
      const loc = MAP_DATA.locations.find(l => l.id === locId);
      if (!loc) return;

      if (activeCategory !== 'all' && loc.category !== activeCategory) {
        setCategory('all');
      }

      map.flyTo([loc.lat, loc.lng], 18.5, { duration: 1.0 });

      setTimeout(() => {
        const marker = markersMap.get(loc.id);
        if (marker) {
          marker.openPopup();
        }
      }, 700);
    }

    // --- 9. CATEGORY FILTER LOGIC ---
    function setCategory(cat) {
      activeCategory = cat;

      document.querySelectorAll('.cat-pill').forEach(pill => {
        const pillCat = pill.dataset.cat;
        if (pillCat === cat) {
          pill.className = "cat-pill active flex items-center gap-2 px-3.5 py-2 rounded-full text-xs font-bold whitespace-nowrap transition shadow-sm bg-[#0e3d26] text-white border border-emerald-600 ring-2 ring-emerald-400/30";
          pill.querySelector('.pill-count').className = "pill-count px-1.5 py-0.5 bg-emerald-950/80 text-emerald-200 rounded-full text-[10px] font-mono";
        } else {
          pill.className = "cat-pill flex items-center gap-2 px-3.5 py-2 rounded-full text-xs font-bold whitespace-nowrap transition shadow-sm bg-white text-gray-700 border border-gray-200 hover:bg-gray-50";
          pill.querySelector('.pill-count').className = "pill-count px-1.5 py-0.5 bg-gray-100 text-gray-600 rounded-full text-[10px] font-mono";
        }
      });

      renderMarkers();

      if (cat === 'all' || cat === 'Estacionamento') {
        if (!map.hasLayer(polygonLayer)) map.addLayer(polygonLayer);
      } else {
        if (map.hasLayer(polygonLayer)) map.removeLayer(polygonLayer);
      }
    }

    document.querySelectorAll('.cat-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        setCategory(btn.dataset.cat);
      });
    });

    // --- 10. LIVE SEARCH AUTOCOMPLETE ---
    const searchInput = document.getElementById('search-input');
    const searchClear = document.getElementById('search-clear');
    const searchResults = document.getElementById('search-results');

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      
      if (!q) {
        searchClear.classList.add('hidden');
        searchResults.classList.add('hidden');
        searchResults.innerHTML = '';
        return;
      }

      searchClear.classList.remove('hidden');

      const matches = MAP_DATA.locations.filter(l => 
        l.name.toLowerCase().includes(q) || 
        l.category.toLowerCase().includes(q) ||
        l.description.toLowerCase().includes(q)
      );

      if (matches.length === 0) {
        searchResults.innerHTML = `
          <div class="px-4 py-3.5 text-xs text-gray-500 text-center font-medium">
            Nenhum setor encontrado para "<strong>${escapeHtml(q)}</strong>"
          </div>
        `;
        searchResults.classList.remove('hidden');
        return;
      }

      searchResults.innerHTML = matches.map(l => {
        let distText = '';
        if (userCoords) {
          const d = getDistanceMeters(userCoords.lat, userCoords.lng, l.lat, l.lng);
          distText = `<span class="text-[10px] font-bold text-sky-600 bg-sky-50 px-2 py-0.5 rounded-full">${formatDistance(d)}</span>`;
        }

        return `
          <div onclick="focusOnPlace('${l.id}'); closeSearch();" class="px-4 py-3 hover:bg-emerald-50 cursor-pointer flex items-center justify-between transition">
            <div>
              <div class="text-sm font-bold text-gray-900">${highlightMatch(l.name, q)}</div>
              <div class="text-[11px] text-gray-500 flex items-center gap-1.5 mt-0.5">
                <span class="w-2 h-2 rounded-full inline-block" style="background-color: ${l.color}"></span>
                <span>${l.category}</span>
                ${distText}
              </div>
            </div>
            <span class="text-xs text-emerald-700 font-bold ml-2">Ver →</span>
          </div>
        `;
      }).join('');

      searchResults.classList.remove('hidden');
    });

    function escapeHtml(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function highlightMatch(text, query) {
      const idx = text.toLowerCase().indexOf(query);
      if (idx === -1) return escapeHtml(text);
      return escapeHtml(text.slice(0, idx)) + 
             `<span class="bg-yellow-200 text-gray-900 px-0.5 rounded">${escapeHtml(text.slice(idx, idx + query.length))}</span>` + 
             escapeHtml(text.slice(idx + query.length));
    }

    function closeSearch() {
      searchResults.classList.add('hidden');
      searchResults.innerHTML = '';
      searchInput.blur();
    }

    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchClear.classList.add('hidden');
      closeSearch();
      renderMarkers();
    });

    document.getElementById('map').addEventListener('click', () => {
      closeSearch();
    });

    // --- 11. MAP LAYER TOGGLE ---
    document.getElementById('btn-toggle-layer').addEventListener('click', () => {
      if (isSatellite) {
        map.removeLayer(googleHybrid);
        map.addLayer(googleRoads);
        isSatellite = false;
        showToast("Visualização: Mapa de Ruas / Terreno");
      } else {
        map.removeLayer(googleRoads);
        map.addLayer(googleHybrid);
        isSatellite = true;
        showToast("Visualização: Imagem de Satélite em Alta Resolução");
      }
    });

    // --- 12. REAL-TIME GEOLOCATION (GPS RADAR) ---
    const btnLocate = document.getElementById('btn-locate-me');
    const gpsActiveBadge = document.getElementById('gps-active-badge');

    btnLocate.addEventListener('click', () => {
      if (!navigator.geolocation) {
        showToast("Seu aparelho não suporta GPS.");
        return;
      }

      showToast("Buscando sua posição no campus do CAET...");

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          updateUserLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
          map.flyTo([pos.coords.latitude, pos.coords.longitude], 18, { duration: 1.2 });
          gpsActiveBadge.classList.remove('hidden');
          showToast(`Sua posição foi localizada (Precisão: ±${Math.round(pos.coords.accuracy)}m)`);
          
          // Re-render markers and drawer to show updated distances
          renderMarkers();
          buildDrawerList();

          if (!watchId) {
            watchId = navigator.geolocation.watchPosition(
              (p) => {
                userCoords = { lat: p.coords.latitude, lng: p.coords.longitude };
                updateUserLocation(p.coords.latitude, p.coords.longitude, p.coords.accuracy);
              },
              (err) => console.warn(err),
              { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
            );
          }
        },
        (err) => {
          showToast("Acesso ao GPS não concedido ou sem sinal.");
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    function updateUserLocation(lat, lng, accuracy) {
      if (!userLocationMarker) {
        const userIcon = L.divIcon({
          className: 'gps-marker',
          html: `
            <div class="relative">
              <div class="gps-pulse-outer"></div>
              <div class="gps-pulse-inner"></div>
            </div>
          `,
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });

        userLocationMarker = L.marker([lat, lng], { icon: userIcon, zIndexOffset: 2000 }).addTo(map);
        userLocationMarker.bindTooltip("Você está aqui no CAET", { permanent: false, direction: 'top' });

        userAccuracyCircle = L.circle([lat, lng], {
          radius: accuracy,
          color: '#0284c7',
          weight: 1,
          opacity: 0.5,
          fillColor: '#38bdf8',
          fillOpacity: 0.12
        }).addTo(map);
      } else {
        userLocationMarker.setLatLng([lat, lng]);
        userAccuracyCircle.setLatLng([lat, lng]);
        userAccuracyCircle.setRadius(accuracy);
      }
    }

    // --- 13. DRAWER (CATALOG OF SECTORS) ---
    const drawer = document.getElementById('drawer');
    const drawerBackdrop = document.getElementById('drawer-backdrop');
    const drawerListContent = document.getElementById('drawer-list-content');
    const drawerSearch = document.getElementById('drawer-search-input');

    function openDrawer() {
      drawerBackdrop.classList.remove('hidden');
      drawer.classList.remove('translate-y-full');
      buildDrawerList(drawerSearch.value);
    }

    function closeDrawer() {
      drawer.classList.add('translate-y-full');
      setTimeout(() => {
        drawerBackdrop.classList.add('hidden');
      }, 300);
    }

    document.getElementById('btn-open-list').addEventListener('click', openDrawer);
    document.getElementById('btn-quick-catalog').addEventListener('click', openDrawer);
    document.getElementById('btn-close-drawer').addEventListener('click', closeDrawer);
    drawerBackdrop.addEventListener('click', closeDrawer);

    drawerSearch.addEventListener('input', (e) => {
      buildDrawerList(e.target.value);
    });

    function buildDrawerList(filterText = '') {
      const q = filterText.trim().toLowerCase();
      let list = MAP_DATA.locations.slice();

      if (q) {
        list = list.filter(l => l.name.toLowerCase().includes(q) || l.category.toLowerCase().includes(q));
      }

      // Sort by distance if userCoords available
      if (userCoords) {
        list.sort((a, b) => {
          const dA = getDistanceMeters(userCoords.lat, userCoords.lng, a.lat, a.lng);
          const dB = getDistanceMeters(userCoords.lat, userCoords.lng, b.lat, b.lng);
          return dA - dB;
        });
      }

      drawerListContent.innerHTML = list.map(l => {
        let distBadge = '';
        if (userCoords) {
          const d = getDistanceMeters(userCoords.lat, userCoords.lng, l.lat, l.lng);
          distBadge = `<span class="text-[10px] font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded-full border border-sky-100">${formatDistance(d)}</span>`;
        }

        return `
          <div onclick="focusOnPlace('${l.id}'); closeDrawer();" class="p-3.5 hover:bg-gray-50 active:bg-emerald-50 cursor-pointer flex items-center justify-between transition">
            <div class="flex items-start gap-3">
              <span class="w-8 h-8 rounded-xl flex items-center justify-center text-sm flex-shrink-0 mt-0.5" style="background-color: ${l.color}15; color: ${l.color}">
                ${l.category === 'Agricultura' ? '🌱' : l.category === 'Produção Animal' ? '🐄' : l.category === 'Infraestrutura & Máquinas' ? '⚙️' : l.category === 'Estacionamento' ? '🚗' : l.category === 'Parceiros' ? '🎓' : 'ℹ️'}
              </span>
              <div>
                <div class="text-sm font-bold text-gray-900 leading-tight">${l.name}</div>
                <div class="text-[11px] text-gray-500 mt-0.5 line-clamp-1">${l.description}</div>
                <div class="flex items-center gap-2 mt-1.5">
                  <span class="text-[10px] font-semibold text-gray-500 uppercase">${l.category}</span>
                  ${distBadge}
                </div>
              </div>
            </div>
            <span class="text-xs font-bold text-emerald-700 flex-shrink-0 ml-2">Ver →</span>
          </div>
        `;
      }).join('');
    }

    // --- 14. STATUS TOAST HELPER ---
    function showToast(text, isAlert = false) {
      const toast = document.getElementById('status-toast');
      const toastText = document.getElementById('status-toast-text');
      const toastDot = document.getElementById('status-toast-dot');
      
      toastText.innerText = text;
      toastDot.className = `w-2 h-2 rounded-full ${isAlert ? 'bg-amber-400' : 'bg-emerald-400'} animate-ping`;
      toast.classList.remove('hidden');

      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        toast.classList.add('hidden');
      }, 3500);
    }

    // --- 15. OFFLINE EVENT LISTENERS ---
    window.addEventListener('offline', () => {
      showToast("Você está offline. O mapa e dados continuam salvos no aparelho!", true);
    });

    window.addEventListener('online', () => {
      showToast("Conexão com a internet restabelecida.");
    });

    // --- 16. SERVICE WORKER REGISTRATION (OFFLINE SUPPORT) ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            console.log('Service Worker registrado com sucesso:', reg.scope);
          })
          .catch((err) => {
            console.warn('Falha ao registrar Service Worker:', err);
          });
      });
    }

    // --- 17. BOOTSTRAP ---
    window.addEventListener('DOMContentLoaded', () => {
      initMap();
    });
  </script>
</body>
</html>
