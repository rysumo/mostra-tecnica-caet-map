<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mostra Técnica CAET — Mapa do Evento</title>
  <meta name="description" content="Guia interativo dos setores didático-produtivos da Mostra Técnica do Colégio Agrícola Estadual de Toledo (CAET) com GPS e suporte offline completo.">

  <!-- PWA & Mobile Capabilities -->
  <meta name="theme-color" content="#0e3d26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mapa CAET">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230e3d26'/><path d='M50 18c-14 0-24 11-24 25 0 19 21 38 23 39a2 2 0 0 0 2 0c2-1 23-20 23-39 0-14-10-25-24-25z' fill='%2322c55e'/><circle cx='50' cy='42' r='10' fill='%23ffffff'/></svg>">

  <!-- Local Styles & Libraries (Zero External CDN Dependency) -->
  <link rel="stylesheet" href="./vendor/leaflet.css">
  <link rel="stylesheet" href="./vendor/MarkerCluster.css">
  <link rel="stylesheet" href="./vendor/MarkerCluster.Default.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- TOP HEADER: Brand, Search & Category Pills -->
  <header class="app-header">
    <div class="header-row">
      <div class="brand-group">
        <div class="brand-eyebrow">
          <span class="brand-dot" aria-hidden="true"></span>
          <span>MOSTRA TÉCNICA CAET</span>
        </div>
        <h1 class="brand-title">Mapa do evento</h1>
      </div>

      <div class="header-actions">
        <!-- Alternar Camada (Google Satélite / Esri / Ruas) -->
        <button type="button" id="btn-toggle-layer" class="icon-btn" title="Alternar camada do mapa" aria-label="Alternar camada do mapa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
          </svg>
        </button>

        <!-- Enquadrar todos os setores -->
        <button type="button" id="btn-fit-bounds" class="icon-btn" title="Enquadrar campus completo" aria-label="Enquadrar campus completo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 9V5a1 1 0 011-1h4M20 9V5a1 1 0 00-1-1h-4M4 15v4a1 1 0 001 1h4M20 15v4a1 1 0 01-1 1h-4"/>
          </svg>
        </button>

        <!-- Geolocalização GPS -->
        <button type="button" id="btn-locate-me" class="icon-btn" title="Minha localização GPS" aria-label="Minha localização GPS">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="7"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 2v3m0 14v3M2 12h3m14 0h3"/>
            <circle cx="12" cy="12" r="2" fill="currentColor"/>
          </svg>
          <span id="gps-active-badge" class="gps-badge" hidden></span>
        </button>

        <!-- Catálogo de Setores -->
        <button type="button" id="btn-open-list" class="icon-btn" title="Abrir catálogo de setores" aria-label="Abrir catálogo de setores">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="search-wrap">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="7"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 20l-4-4"/>
          </svg>
        </span>
        <label for="search-input" class="sr-only">Pesquisar local ou setor</label>
        <input
          id="search-input"
          class="search-input"
          type="search"
          placeholder="Pesquisar setor (ex: agua, cafe, suinos...)"
          autocomplete="off"
        >
        <button type="button" id="search-clear" class="search-clear" aria-label="Limpar pesquisa" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div id="search-results" class="search-results" hidden></div>
    </div>

    <!-- Category Pills -->
    <nav class="pills-bar" aria-label="Filtrar setores por categoria">
      <button type="button" data-cat="all" data-color="#16a34a" aria-pressed="true" class="cat-pill active">
        <span class="pill-icon"></span>
        <span>Todos</span>
        <span class="pill-count">34</span>
      </button>

      <button type="button" data-cat="Agricultura" data-color="#16a34a" aria-pressed="false" class="cat-pill">
        <span class="pill-icon"></span>
        <span>Agricultura</span>
        <span class="pill-count">11</span>
      </button>

      <button type="button" data-cat="Produção Animal" data-color="#b45309" aria-pressed="false" class="cat-pill">
        <span class="pill-icon"></span>
        <span>Produção Animal</span>
        <span class="pill-count">12</span>
      </button>

      <button type="button" data-cat="Infraestrutura & Máquinas" data-color="#2563eb" aria-pressed="false" class="cat-pill">
        <span class="pill-icon"></span>
        <span>Infraestrutura</span>
        <span class="pill-count">3</span>
      </button>

      <button type="button" data-cat="Serviços" data-color="#0891b2" aria-pressed="false" class="cat-pill">
        <span class="pill-icon"></span>
        <span>Serviços</span>
        <span class="pill-count">6</span>
      </button>

      <button type="button" data-cat="Estacionamento" data-color="#7c3aed" aria-pressed="false" class="cat-pill">
        <span class="pill-icon"></span>
        <span>Estacionamento</span>
        <span class="pill-count">1</span>
      </button>

      <button type="button" data-cat="Parceiros" data-color="#881337" aria-pressed="false" class="cat-pill">
        <span class="pill-icon"></span>
        <span>Parceiros</span>
        <span class="pill-count">1</span>
      </button>
    </nav>
  </header>

  <!-- INTERACTIVE MAP -->
  <main id="map" aria-label="Mapa interativo da Mostra Técnica do CAET"></main>

  <!-- FLOATING QUICK CATALOG LAUNCHER -->
  <div id="quick-catalog-wrap" class="quick-catalog-wrap">
    <button type="button" id="btn-quick-catalog" class="quick-catalog-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
      </svg>
      <span id="btn-quick-catalog-label">Setores (34)</span>
    </button>
  </div>

  <!-- NON-MODAL BOTTOM CARD FOR SELECTED SECTOR -->
  <aside id="sector-card" class="sector-card" aria-label="Detalhes do setor selecionado" hidden></aside>

  <!-- NATIVE MODAL DIALOG: SECTOR CATALOG & CHECKLIST -->
  <dialog id="catalog-dialog" closedby="any" aria-labelledby="catalog-title">
    <div class="dialog-grabber" aria-hidden="true">
      <div class="dialog-grabber-bar"></div>
    </div>

    <div class="dialog-header">
      <div>
        <h1 id="catalog-title" class="dialog-title">Catálogo de Setores</h1>
        <p class="dialog-subtitle">Toque em um setor para centralizar no mapa</p>
      </div>
      <button type="button" id="btn-close-catalog" class="catalog-close" aria-label="Fechar catálogo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="catalog-meta">
      <div class="progress-row">
        <span id="catalog-progress-text">0/34 setores visitados</span>
        <span id="offline-cache-status" class="offline-status-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
          <span>App pronto offline</span>
        </span>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div id="catalog-progress-fill" class="progress-fill"></div>
      </div>
    </div>

    <div class="catalog-controls">
      <label for="catalog-search-input" class="sr-only">Filtrar setores no catálogo</label>
      <input
        id="catalog-search-input"
        class="catalog-search"
        type="search"
        placeholder="Filtrar lista (sem necessidade de acentos)..."
      >
      <div class="segment-group" role="group" aria-label="Filtrar por visitação">
        <button type="button" class="segment-btn active" data-filter="all" aria-pressed="true">Todos</button>
        <button type="button" class="segment-btn" data-filter="pending" aria-pressed="false">Faltam</button>
        <button type="button" class="segment-btn" data-filter="visited" aria-pressed="false">Visitados</button>
      </div>
    </div>

    <div id="catalog-list" class="catalog-list"></div>
  </dialog>

  <!-- STATUS TOAST -->
  <div id="status-toast" class="status-toast" role="status" aria-live="polite" hidden>
    <span id="status-toast-dot" class="toast-dot" aria-hidden="true"></span>
    <span id="status-toast-text">Carregando...</span>
  </div>

  <script src="./vendor/leaflet.js"></script>
  <script src="./vendor/leaflet.markercluster.js"></script>
  <script src="./app.js"></script>
</body>
</html>
